<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="640" height="440" fill="#f4f7fb"/>
  <rect x="24" y="24" width="592" height="392" rx="14" fill="#ffffff" stroke="#d9e2ee"/>
  <rect x="24" y="24" width="592" height="44" rx="14" fill="#5a46a0"/>
  <rect x="24" y="54" width="592" height="14" fill="#5a46a0"/>
  <text x="44" y="51" fill="#ffffff" font-size="15" font-weight="700">Evidence and Explanation Coach</text>
  <text x="596" y="51" fill="#e3ddf5" font-size="13" text-anchor="end">ELA · Grade 10</text>

  <!-- claim -->
  <text x="44" y="96" font-size="12" fill="#5b6b80" font-weight="700">CLAIM TO CHECK</text>
  <rect x="44" y="104" width="552" height="48" rx="8" fill="#f1ecf9"/>
  <text x="60" y="133" font-size="15" fill="#1e2a3a" font-weight="700">"Teens who sleep less than 8 hours get lower grades."</text>

  <!-- sources -->
  <text x="44" y="180" font-size="12" fill="#5b6b80" font-weight="700">YOUR EVIDENCE</text>
  <g font-size="13">
    <rect x="44" y="190" width="352" height="46" rx="8" fill="#ffffff" stroke="#d9e2ee"/>
    <rect x="56" y="202" width="64" height="22" rx="11" fill="#e9f7ef"/>
    <text x="88" y="217" fill="#2f9e6a" font-weight="700" font-size="11" text-anchor="middle">APPROVED</text>
    <text x="130" y="211" fill="#1e2a3a" font-weight="700">CDC: Sleep in middle and high school</text>
    <text x="130" y="228" fill="#5b6b80" font-size="12">Supports the claim</text>

    <rect x="44" y="244" width="352" height="46" rx="8" fill="#ffffff" stroke="#d9e2ee"/>
    <rect x="56" y="256" width="64" height="22" rx="11" fill="#e9f7ef"/>
    <text x="88" y="271" fill="#2f9e6a" font-weight="700" font-size="11" text-anchor="middle">APPROVED</text>
    <text x="130" y="265" fill="#1e2a3a" font-weight="700">School library database article</text>
    <text x="130" y="282" fill="#5b6b80" font-size="12">Partly supports the claim</text>

    <rect x="44" y="298" width="352" height="46" rx="8" fill="#fff6ee" stroke="#f0c39a"/>
    <rect x="56" y="310" width="64" height="22" rx="11" fill="#fde4d0"/>
    <text x="88" y="325" fill="#c2621c" font-weight="700" font-size="11" text-anchor="middle">CHECK</text>
    <text x="130" y="319" fill="#1e2a3a" font-weight="700">AI chatbot summary (no source given)</text>
    <text x="130" y="336" fill="#7a4a1f" font-size="12">Where did this come from? Find the original.</text>
  </g>

  <!-- meter -->
  <rect x="412" y="170" width="184" height="174" rx="10" fill="#f4f7fb"/>
  <text x="426" y="194" font-size="12" fill="#5b6b80" font-weight="700">EVIDENCE STRENGTH</text>
  <rect x="426" y="206" width="156" height="12" rx="6" fill="#d9e2ee"/>
  <rect x="426" y="206" width="96" height="12" rx="6" fill="#7a5bb5"/>
  <text x="426" y="240" font-size="13" fill="#1e2a3a" font-weight="700">Missing evidence</text>
  <text x="426" y="262" font-size="12" fill="#3a4757">Does sleep cause lower</text>
  <text x="426" y="278" font-size="12" fill="#3a4757">grades, or do they just</text>
  <text x="426" y="294" font-size="12" fill="#3a4757">happen together?</text>
  <text x="426" y="324" font-size="12" fill="#5a46a0" font-weight="700">Look for a study that</text>
  <text x="426" y="338" font-size="12" fill="#5a46a0" font-weight="700">compares both groups.</text>

  <rect x="44" y="360" width="552" height="44" rx="10" fill="#f1ecf9"/>
  <text x="60" y="381" font-size="13" fill="#3d2f73" font-weight="700">Explain it in your own words:</text>
  <text x="60" y="397" font-size="13" fill="#5b6b80">Based on my sources, the claim is partly supported because ...</text>
</svg>
