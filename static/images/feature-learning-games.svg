<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="640" height="440" fill="#f4f7fb"/>
  <rect x="24" y="24" width="592" height="392" rx="14" fill="#ffffff" stroke="#d9e2ee"/>
  <rect x="24" y="24" width="592" height="44" rx="14" fill="#1d5fa8"/>
  <rect x="24" y="54" width="592" height="14" fill="#1d5fa8"/>
  <text x="44" y="51" fill="#ffffff" font-size="15" font-weight="700">AI Learning Games</text>
  <text x="596" y="51" fill="#dbe8f7" font-size="13" text-anchor="end">Fraction Quest · Grade 4</text>

  <!-- level path -->
  <text x="44" y="98" font-size="12" fill="#5b6b80" font-weight="700">LEVEL 3 OF 5</text>
  <g>
    <line x1="56" y1="118" x2="232" y2="118" stroke="#d9e2ee" stroke-width="6" stroke-linecap="round"/>
    <line x1="56" y1="118" x2="144" y2="118" stroke="#2f9e6a" stroke-width="6" stroke-linecap="round"/>
    <circle cx="56" cy="118" r="10" fill="#2f9e6a"/>
    <circle cx="100" cy="118" r="10" fill="#2f9e6a"/>
    <circle cx="144" cy="118" r="12" fill="#1d5fa8" stroke="#ffffff" stroke-width="3"/>
    <circle cx="188" cy="118" r="10" fill="#ffffff" stroke="#9fb1c7" stroke-width="2"/>
    <circle cx="232" cy="118" r="10" fill="#ffffff" stroke="#9fb1c7" stroke-width="2"/>
  </g>
  <!-- stars and streak -->
  <g font-size="13" font-weight="700">
    <rect x="452" y="84" width="144" height="46" rx="10" fill="#fff6ee"/>
    <text x="466" y="104" fill="#c2621c">Streak: 4 in a row</text>
    <text x="466" y="122" fill="#7a4a1f" font-weight="400" font-size="12">Challenge level rising</text>
  </g>

  <!-- challenge -->
  <rect x="44" y="146" width="552" height="122" rx="12" fill="#eef3fa"/>
  <text x="64" y="174" font-size="13" fill="#5b6b80" font-weight="700">CHALLENGE</text>
  <text x="64" y="200" font-size="18" fill="#1e2a3a" font-weight="700">Drag the pizza slices so both friends get the same amount.</text>
  <!-- pizzas -->
  <g>
    <circle cx="120" cy="238" r="22" fill="#f6c85f" stroke="#c98d2a" stroke-width="2"/>
    <path d="M120 216 A22 22 0 0 1 120 260 Z" fill="#e8833a"/>
    <line x1="120" y1="216" x2="120" y2="260" stroke="#c98d2a" stroke-width="2"/>
    <line x1="98" y1="238" x2="142" y2="238" stroke="#c98d2a" stroke-width="2"/>
    <text x="152" y="244" font-size="15" fill="#1e2a3a" font-weight="700">2/4</text>
    <text x="196" y="244" font-size="18" fill="#5b6b80">=</text>
    <circle cx="246" cy="238" r="22" fill="#f6c85f" stroke="#c98d2a" stroke-width="2"/>
    <path d="M246 216 A22 22 0 0 1 246 260 Z" fill="#e8833a"/>
    <line x1="246" y1="216" x2="246" y2="260" stroke="#c98d2a" stroke-width="2"/>
    <text x="278" y="244" font-size="15" fill="#1e2a3a" font-weight="700">?/2</text>
  </g>
  <g font-size="15" font-weight="700">
    <rect x="380" y="220" width="56" height="36" rx="8" fill="#ffffff" stroke="#d9e2ee"/><text x="402" y="244" fill="#1e2a3a">1</text>
    <rect x="446" y="220" width="56" height="36" rx="8" fill="#ffffff" stroke="#d9e2ee"/><text x="468" y="244" fill="#1e2a3a">2</text>
    <rect x="512" y="220" width="56" height="36" rx="8" fill="#ffffff" stroke="#d9e2ee"/><text x="534" y="244" fill="#1e2a3a">4</text>
  </g>

  <!-- hint -->
  <rect x="44" y="286" width="552" height="74" rx="10" fill="#fff6ee" stroke="#f0c39a"/>
  <circle cx="72" cy="312" r="14" fill="#e8833a"/>
  <text x="72" y="317" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">AI</text>
  <text x="96" y="310" font-size="13" fill="#7a4a1f" font-weight="700">Hint, not the answer</text>
  <text x="96" y="331" font-size="13" fill="#5c3a19">Look at the first pizza. How much of it is shaded? Is that more or less than half?</text>
  <text x="96" y="350" font-size="12" fill="#9a6a3f">Hint 1 of 3 · Your teacher can see which hints you used</text>

  <rect x="448" y="376" width="148" height="28" rx="14" fill="#1d5fa8"/>
  <text x="522" y="395" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">Check my answer</text>
  <text x="44" y="395" font-size="12" fill="#5b6b80">Next challenge adjusts to how you did on this one.</text>
</svg>
